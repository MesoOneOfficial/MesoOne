<!DOCTYPE html>
<html lang="en">
<head>
<meta name="description" content="Official MesoOne Webpage.">
<meta name="google-site-verification" content="bZ4_gLPz_LGEBsykCw43NhEx6PZDSqOlHV2MP_KpypU" />
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MesoOne | Official MesoOne Page</title>

<style>
:root {
    --bg-color: #e1e1e1;
    --text-color: #222;
    --header-bg: #000;
    --header-color: #fbcf2f;
    --tagline-color: #aaaaaa;
    --article-bg: #fff;
    --article-border: #999;
    --footer-bg: #e1e1e1;
    --footer-color: #000000;
    --link-color: #0066cc;
    --link-hover: #004499;
}

body.dark-mode {
    --bg-color: #1e1e1e;
    --text-color: #e0e0e0;
    --header-bg: #111;
    --header-color: #fbcf2f;
    --tagline-color: #cccccc;
    --article-bg: #222;
    --article-border: #555;
    --footer-bg: #1e1e1e;
    --footer-color: #f0f0f0;
    --link-color: #66aaff;
    --link-hover: #3399ff;
}

body {
    font-family: Arial, sans-serif;
    background: var(--bg-color);
    color: var(--text-color);
    margin:0;
    padding:0;
}

header {
    display:flex;
    flex-direction:column;
    align-items:center;
    background: var(--header-bg);
    color: var(--header-color);
    padding:20px;
}

.header-top {
    display:flex;
    justify-content:space-between;
    align-items:center;
    width:100%;
    max-width:1200px;
}

.header-left h1 {
    margin:0;
    font-size:2rem;
    color: var(--header-color);
}

.header-left .tagline {
    margin-top:5px;
    font-size:0.9rem;
    color: var(--tagline-color);
}

.header-right .logo {
    height:60px;
    width:auto;
}

nav {
    margin-top:15px;
    text-align:center;
}

nav a {
    color: var(--header-color);
    text-decoration:none;
    margin:0 15px;
    font-weight:bold;
}

nav a:hover {
    color: var(--link-hover);
}

main {
    display:flex;
    justify-content:center;
    width:100%;
}

.container {
    width:100%;
    max-width:1200px;
    margin:30px auto;
    padding:0 20px;
}

article {
    background: var(--article-bg);
    padding:20px;
    margin-bottom:20px;
    border:2px solid var(--article-border);
    border-radius:6px;
}

/* ===== COLOUR TABLE SECTION ===== */

.colortables {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    align-items: flex-start;
}

.ct-box {
    flex: 1;
    min-width: 300px;
}

.ct-toggle {
    width: 100%;
    padding: 10px;
    font-weight: bold;
    background: var(--header-bg);
    color: var(--header-color);
    border: 2px solid var(--article-border);
    cursor: pointer;
    border-radius: 4px;
}

.ct-toggle:hover {
    background: var(--header-color);
    color: var(--header-bg);
}

.ct-content {
    display: none;
    margin-top: 10px;
    width: 100%;
}

.ct-content textarea {
    width: 100%;
    height: 240px;
    box-sizing: border-box;
    overflow: auto;
    background: var(--article-bg);
    color: var(--text-color);
    border: 2px solid var(--article-border);
    padding: 10px;
    resize: vertical;
    font-family: monospace;
    white-space: pre;
}

/* ===== END SECTION ===== */

footer {
    background: var(--footer-bg);
    color: var(--footer-color);
    text-align:center;
    padding:15px;
}

@media(max-width:900px){
    .header-top{
        flex-direction:column;
        align-items:center;
    }
}
</style>
</head>

<body>

<header>
    <div class="header-top">
        <div class="header-left">
            <h1>MesoOne</h1>
            <p class="tagline">Severe weather interception, research and alerts.</p>
        </div>
        <div class="header-right">
            <img src="MesoOneLogo.png" alt="Tornado Tracker Logo" class="logo">
        </div>
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="community.html">Community</a>
    </nav>
</header>

<main>
<div class="container">

<article>
<h2>Welcome to MesoOne</h2>

<p>2025 MesoOne</p>
</footer>

<script>
// Dropdown toggle (only one open)
document.querySelectorAll('.ct-toggle').forEach(button => {
    button.addEventListener('click', () => {
        const content = button.nextElementSibling;

        document.querySelectorAll('.ct-content').forEach(c => {
            if (c !== content) c.style.display = "none";
        });

        content.style.display =
            content.style.display === "block" ? "none" : "block";
    });
});
</script>

</body>
</html>
